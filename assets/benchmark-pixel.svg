<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 220" width="880" height="220" shape-rendering="crispEdges">
  <style>
    .mono { font-family: 'Cascadia Mono', 'Fira Code', 'Consolas', monospace; }
    .hdr { font-family: 'Cascadia Mono', 'Fira Code', 'Consolas', monospace; font-weight: 700; }
  </style>

  <!-- Frame -->
  <rect x="0" y="0" width="880" height="220" fill="#0d1117" rx="10" />
  <rect x="4" y="4" width="872" height="212" fill="#0d1117" stroke="#30363d" stroke-width="2" rx="8" />

  <!-- Header -->
  <rect x="16" y="14" width="848" height="26" fill="#161b22" stroke="#30363d" stroke-width="1.5" />
  <rect x="26" y="22" width="10" height="10" fill="#22c55e" />
  <text x="44" y="31" fill="#e2e8f0" font-size="12" class="hdr">MEASURED FOOTPRINT // ZALO GOC (v26.11.20) VS ZALO ULTRA CLIENT</text>

  <!-- Section 1: Working Set RAM -->
  <text x="24" y="62" fill="#94a3b8" font-size="11" class="hdr">PHYSICAL RAM (WORKING SET)</text>

  <!-- Bar 1: Official -->
  <text x="24" y="84" fill="#fca5a5" font-size="11" class="mono">Zalo Goc (Official)</text>
  <rect x="210" y="72" width="480" height="16" fill="#161b22" stroke="#30363d" stroke-width="1" />
  <rect x="212" y="74" width="380" height="12" fill="#ef4444">
    <animate attributeName="width" values="0;380" dur="1.1s" fill="freeze" />
  </rect>
  <text x="702" y="84" fill="#fca5a5" font-size="11" class="mono">956.3 MB</text>

  <!-- Bar 2: Ultra Active -->
  <text x="24" y="108" fill="#7dd3fc" font-size="11" class="mono">Zalo Ultra (Active)</text>
  <rect x="210" y="96" width="480" height="16" fill="#161b22" stroke="#30363d" stroke-width="1" />
  <rect x="212" y="98" width="152" height="12" fill="#38bdf8">
    <animate attributeName="width" values="0;152" dur="1.1s" fill="freeze" />
  </rect>
  <text x="702" y="108" fill="#7dd3fc" font-size="11" class="mono">380.8 MB (-60%)</text>

  <!-- Bar 3: Ultra Idle/Minimized -->
  <text x="24" y="132" fill="#86efac" font-size="11" class="mono">Zalo Ultra (Idle/Min)</text>
  <rect x="210" y="120" width="480" height="16" fill="#161b22" stroke="#30363d" stroke-width="1" />
  <rect x="212" y="122" width="38" height="12" fill="#22c55e">
    <animate attributeName="width" values="0;38" dur="1.1s" fill="freeze" />
  </rect>
  <text x="702" y="132" fill="#86efac" font-size="11" class="mono">~65-130 MB (-90%)</text>

  <!-- Section 2: Private Commit -->
  <text x="24" y="160" fill="#94a3b8" font-size="11" class="hdr">PRIVATE COMMIT MEMORY</text>

  <text x="24" y="182" fill="#cbd5e1" font-size="11" class="mono">Goc 1555 MB vs Ultra 914 MB</text>
  <rect x="210" y="170" width="480" height="16" fill="#161b22" stroke="#30363d" stroke-width="1" />
  <rect x="212" y="172" width="476" height="6" fill="#f97316" opacity="0.8" />
  <rect x="212" y="178" width="280" height="6" fill="#22c55e" />
  <text x="702" y="182" fill="#86efac" font-size="11" class="mono">-41% Commit</text>

  <!-- Trade-off Footer -->
  <text x="24" y="204" fill="#fbbf24" font-size="11" class="mono">Trade-off: Ultra trades higher V8 GC CPU (~26.1s/min vs 7.9s/min) for 2.5x-10x lower RAM.</text>
</svg>
