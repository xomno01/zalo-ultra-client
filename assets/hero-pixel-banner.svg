<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 240" width="880" height="240" shape-rendering="crispEdges">
  <style>
    @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
    @keyframes pulse { 0%, 100% { opacity: 0.45; } 50% { opacity: 1; } }
    @keyframes floatY { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-4px); } }
    @keyframes scanline { 0% { transform: translateY(0px); opacity: 0.12; } 50% { opacity: 0.22; } 100% { transform: translateY(220px); opacity: 0.04; } }
    .cursor { animation: blink 1s steps(1, end) infinite; }
    .star1 { animation: pulse 2.2s ease-in-out infinite; }
    .star2 { animation: pulse 3.1s ease-in-out 0.6s infinite; }
    .star3 { animation: pulse 1.8s ease-in-out 1.1s infinite; }
    .emblem { animation: floatY 3.2s steps(4, end) infinite; }
    .scan { animation: scanline 4.5s linear infinite; }
    .title { font-family: 'Cascadia Mono', 'Fira Code', 'Consolas', monospace; font-weight: 800; letter-spacing: 3px; }
    .mono { font-family: 'Cascadia Mono', 'Fira Code', 'Consolas', monospace; }
  </style>

  <!-- Outer Dark Frame -->
  <rect x="0" y="0" width="880" height="240" fill="#0d1117" rx="10" />
  <rect x="4" y="4" width="872" height="232" fill="#0d1117" stroke="#30363d" stroke-width="2" rx="8" />

  <!-- Subtle Pixel Grid Background -->
  <g fill="#161b22">
    <rect x="20" y="20" width="840" height="2" />
    <rect x="20" y="60" width="840" height="2" />
    <rect x="20" y="100" width="840" height="2" />
    <rect x="20" y="140" width="840" height="2" />
    <rect x="20" y="180" width="840" height="2" />
    <rect x="20" y="220" width="840" height="2" />
    <rect x="140" y="16" width="2" height="208" />
    <rect x="280" y="16" width="2" height="208" />
    <rect x="420" y="16" width="2" height="208" />
    <rect x="560" y="16" width="2" height="208" />
    <rect x="700" y="16" width="2" height="208" />
  </g>

  <!-- Pixel Corner Brackets -->
  <g fill="#38bdf8">
    <rect x="12" y="12" width="16" height="4" /><rect x="12" y="12" width="4" height="16" />
    <rect x="852" y="12" width="16" height="4" /><rect x="864" y="12" width="4" height="16" />
    <rect x="12" y="224" width="16" height="4" /><rect x="12" y="212" width="4" height="16" />
    <rect x="852" y="224" width="16" height="4" /><rect x="864" y="212" width="4" height="16" />
  </g>

  <!-- Twinkling Pixel Stars -->
  <g>
    <rect class="star1" x="64" y="34" width="4" height="4" fill="#38bdf8" />
    <rect class="star2" x="236" y="42" width="4" height="4" fill="#22c55e" />
    <rect class="star3" x="492" y="28" width="4" height="4" fill="#f59e0b" />
    <rect class="star1" x="628" y="46" width="4" height="4" fill="#38bdf8" />
    <rect class="star2" x="812" y="36" width="6" height="6" fill="#22c55e" />
    <rect class="star3" x="760" y="196" width="4" height="4" fill="#38bdf8" />
    <rect class="star1" x="44" y="196" width="4" height="4" fill="#f59e0b" />
  </g>

  <!-- Scanline Sweep -->
  <rect class="scan" x="8" y="8" width="864" height="4" fill="#38bdf8" opacity="0.12" />

  <!-- Pixel Art Shield + Lightning Emblem (Left) -->
  <g class="emblem" transform="translate(46, 52)">
    <!-- Shield Outer Border (16x18 pixel grid scaled 7px = 112x126) -->
    <rect x="14" y="0" width="84" height="7" fill="#38bdf8" />
    <rect x="7" y="7" width="98" height="7" fill="#38bdf8" />
    <rect x="0" y="14" width="112" height="56" fill="#1d4ed8" />
    <rect x="0" y="14" width="7" height="56" fill="#38bdf8" />
    <rect x="105" y="14" width="7" height="56" fill="#38bdf8" />
    <rect x="7" y="14" width="98" height="7" fill="#2563eb" />
    <!-- Shield Lower Taper -->
    <rect x="7" y="70" width="98" height="14" fill="#1d4ed8" />
    <rect x="7" y="70" width="7" height="14" fill="#38bdf8" />
    <rect x="98" y="70" width="7" height="14" fill="#38bdf8" />
    <rect x="14" y="84" width="84" height="14" fill="#1e40af" />
    <rect x="14" y="84" width="7" height="14" fill="#38bdf8" />
    <rect x="91" y="84" width="7" height="14" fill="#38bdf8" />
    <rect x="28" y="98" width="56" height="14" fill="#1e3a8a" />
    <rect x="21" y="98" width="7" height="14" fill="#38bdf8" />
    <rect x="84" y="98" width="7" height="14" fill="#38bdf8" />
    <rect x="42" y="112" width="28" height="7" fill="#38bdf8" />

    <!-- Pixel Lightning Bolt Inside Shield -->
    <rect x="56" y="21" width="21" height="14" fill="#fde047" />
    <rect x="49" y="35" width="21" height="14" fill="#fde047" />
    <rect x="35" y="49" width="42" height="14" fill="#facc15" />
    <rect x="49" y="63" width="21" height="14" fill="#fde047" />
    <rect x="42" y="77" width="21" height="14" fill="#facc15" />
    <rect x="35" y="91" width="14" height="7" fill="#fef08a" />
  </g>

  <!-- Main Title + Subtitle -->
  <g transform="translate(184, 62)">
    <rect x="0" y="0" width="198" height="22" fill="#161b22" stroke="#22c55e" stroke-width="2" />
    <rect x="8" y="7" width="8" height="8" fill="#22c55e">
      <animate attributeName="opacity" values="1;0.3;1" dur="1.4s" repeatCount="indefinite" />
    </rect>
    <text x="24" y="15" fill="#4ade80" font-size="11" class="mono">SYSTEM OPTIMIZED // V2</text>

    <text x="0" y="64" fill="#f8fafc" font-size="36" class="title">ZALO ULTRA CLIENT</text>
    <rect x="436" y="38" width="14" height="28" fill="#38bdf8" class="cursor" />

    <text x="0" y="92" fill="#94a3b8" font-size="13" class="mono">GO NATIVE SUPERVISOR  •  LEAN ELECTRON RUNTIME  •  MULTI-INSTANCE VOIP</text>

    <!-- Status Pills -->
    <g transform="translate(0, 112)">
      <rect x="0" y="0" width="132" height="24" fill="#0c4a6e" stroke="#38bdf8" stroke-width="1.5" />
      <text x="12" y="16" fill="#bae6fd" font-size="11" class="mono">CAP-GUARD: ON</text>

      <rect x="142" y="0" width="150" height="24" fill="#064e3b" stroke="#22c55e" stroke-width="1.5" />
      <text x="154" y="16" fill="#bbf7d0" font-size="11" class="mono">ZERO TELEMETRY</text>

      <rect x="302" y="0" width="152" height="24" fill="#451a03" stroke="#f59e0b" stroke-width="1.5" />
      <text x="314" y="16" fill="#fde68a" font-size="11" class="mono">PIPE: _ultra_9333</text>
    </g>
  </g>

  <!-- Animated Pixel RAM Gauge (Right) -->
  <g transform="translate(692, 54)">
    <rect x="0" y="0" width="156" height="132" fill="#161b22" stroke="#30363d" stroke-width="2" />
    <text x="12" y="20" fill="#94a3b8" font-size="11" class="mono">LIVE RAM METER</text>

    <!-- Pixel Segmented Meter Track -->
    <rect x="12" y="32" width="132" height="20" fill="#0d1117" stroke="#30363d" stroke-width="2" />
    <rect x="16" y="36" width="124" height="12" fill="#ef4444">
      <animate attributeName="width" values="124;28;28;124" dur="5s" repeatCount="indefinite" />
      <animate attributeName="fill" values="#ef4444;#22c55e;#22c55e;#ef4444" dur="5s" repeatCount="indefinite" />
    </rect>
    <!-- Pixel Divider Cuts -->
    <g fill="#161b22">
      <rect x="38" y="34" width="3" height="16" />
      <rect x="60" y="34" width="3" height="16" />
      <rect x="82" y="34" width="3" height="16" />
      <rect x="104" y="34" width="3" height="16" />
      <rect x="126" y="34" width="3" height="16" />
    </g>

    <text x="12" y="72" fill="#f87171" font-size="11" class="mono">Zalo Goc : 956 MB</text>
    <text x="12" y="92" fill="#4ade80" font-size="11" class="mono">Ultra Act: 381 MB</text>
    <text x="12" y="112" fill="#38bdf8" font-size="11" class="mono">Ultra Min: ~95 MB</text>
  </g>
</svg>
