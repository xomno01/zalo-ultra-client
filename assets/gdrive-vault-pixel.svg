<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 230" width="880" height="230" shape-rendering="crispEdges">
  <style>
    .mono { font-family: 'Cascadia Mono', 'Fira Code', 'Consolas', monospace; }
    .hdr { font-family: 'Cascadia Mono', 'Fira Code', 'Consolas', monospace; font-weight: 700; }
  </style>

  <!-- Canvas -->
  <rect x="0" y="0" width="880" height="230" fill="#0d1117" rx="10" />
  <rect x="4" y="4" width="872" height="222" fill="#0d1117" stroke="#30363d" stroke-width="2" rx="8" />

  <!-- Header -->
  <rect x="16" y="14" width="848" height="26" fill="#161b22" stroke="#30363d" stroke-width="1.5" />
  <rect x="26" y="22" width="10" height="10" fill="#4285f4" />
  <text x="44" y="31" fill="#e2e8f0" font-size="12" class="hdr">ZALO CLOUD VAULT // HYBRID SMART GOOGLE DRIVE SYNC</text>
  <text x="708" y="31" fill="#4ade80" font-size="11" class="mono">[SQLITE WAL SAFE]</text>

  <!-- Block 1: Local SSD Core -->
  <g transform="translate(24, 56)">
    <rect x="0" y="0" width="236" height="142" fill="#161b22" stroke="#38bdf8" stroke-width="2" />
    <rect x="0" y="0" width="236" height="26" fill="#0c4a6e" />
    <text x="12" y="17" fill="#e0f2fe" font-size="11" class="hdr">1. LOCAL SSD RUNTIME</text>

    <rect x="12" y="38" width="212" height="24" fill="#0d1117" stroke="#1e293b" stroke-width="1.5" />
    <rect x="18" y="46" width="8" height="8" fill="#22c55e">
      <animate attributeName="opacity" values="1;0.3;1" dur="1.3s" repeatCount="indefinite" />
    </rect>
    <text x="34" y="54" fill="#bae6fd" font-size="11" class="mono">SQLite WAL on SSD</text>

    <text x="12" y="82" fill="#94a3b8" font-size="11" class="mono">• Zero symlink corruption</text>
    <text x="12" y="102" fill="#94a3b8" font-size="11" class="mono">• Watch new Media / DB</text>
    <text x="12" y="122" fill="#4ade80" font-size="11" class="mono">• Instant local read/write</text>
  </g>

  <!-- Animated Upload Packets 1 -> 2 -->
  <g transform="translate(262, 120)">
    <rect x="0" y="4" width="38" height="4" fill="#1e293b" />
    <rect x="0" y="2" width="10" height="8" fill="#38bdf8">
      <animate attributeName="x" values="0;28;0" dur="1.5s" repeatCount="indefinite" />
    </rect>
  </g>

  <!-- Block 2: HybridDriveManager + AutoSync Daemon -->
  <g transform="translate(302, 56)">
    <rect x="0" y="0" width="276" height="142" fill="#161b22" stroke="#22c55e" stroke-width="2" />
    <rect x="0" y="0" width="276" height="26" fill="#064e3b" />
    <text x="12" y="17" fill="#dcfce7" font-size="11" class="hdr">2. HYBRID SYNC ENGINE</text>

    <rect x="12" y="38" width="252" height="24" fill="#0d1117" stroke="#1e293b" stroke-width="1.5" />
    <rect x="18" y="46" width="8" height="8" fill="#facc15">
      <animate attributeName="opacity" values="1;0.2;1" dur="1.1s" begin="0.2s" repeatCount="indefinite" />
    </rect>
    <text x="34" y="54" fill="#bbf7d0" font-size="11" class="mono">HybridDriveManager + Daemon</text>

    <text x="12" y="82" fill="#94a3b8" font-size="11" class="mono">• Incremental Media Sync</text>
    <text x="12" y="102" fill="#94a3b8" font-size="11" class="mono">• Compressed DB Snapshots</text>
    <text x="12" y="122" fill="#fde047" font-size="11" class="mono">• OAuth2 Local Server :8585</text>
  </g>

  <!-- Animated Upload Packets 2 -> 3 -->
  <g transform="translate(580, 120)">
    <rect x="0" y="4" width="38" height="4" fill="#1e293b" />
    <rect x="0" y="2" width="10" height="8" fill="#22c55e">
      <animate attributeName="x" values="0;28;0" dur="1.5s" begin="0.4s" repeatCount="indefinite" />
    </rect>
  </g>

  <!-- Block 3: Google Drive Cloud Vault -->
  <g transform="translate(620, 56)">
    <rect x="0" y="0" width="236" height="142" fill="#161b22" stroke="#f59e0b" stroke-width="2" />
    <rect x="0" y="0" width="236" height="26" fill="#451a03" />
    <text x="12" y="17" fill="#fef3c7" font-size="11" class="hdr">3. GOOGLE DRIVE VAULT</text>

    <!-- Pixel Drive Triangle Emblem -->
    <g transform="translate(14, 38)">
      <rect x="8" y="0" width="8" height="6" fill="#facc15" />
      <rect x="4" y="6" width="6" height="6" fill="#22c55e" />
      <rect x="14" y="6" width="6" height="6" fill="#facc15" />
      <rect x="0" y="12" width="8" height="6" fill="#22c55e" />
      <rect x="8" y="12" width="16" height="6" fill="#3b82f6" />
    </g>
    <text x="46" y="52" fill="#fde68a" font-size="11" class="mono">Dual Sync Transport</text>

    <text x="12" y="82" fill="#94a3b8" font-size="11" class="mono">• Mounted (G:\ / U:\ Drive)</text>
    <text x="12" y="102" fill="#94a3b8" font-size="11" class="mono">• Google Drive API v3</text>
    <text x="12" y="122" fill="#7dd3fc" font-size="11" class="mono">• Vault/&lt;Name&gt;_&lt;UID&gt;/</text>
  </g>

  <!-- Footer -->
  <text x="24" y="214" fill="#64748b" font-size="11" class="mono">Per-account UID isolation • Auto-refresh OAuth2 tokens • Point-in-time DB versioning</text>
</svg>
